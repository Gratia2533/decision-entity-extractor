[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "entity-resolution"
version = "2.0.0"
description = "Configurable, scenario-neutral entity resolution"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.10,<3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
entity-resolver = "transport.cli:main"

[project.optional-dependencies]
decision = [
    "httpx2>=2,<3",
    "typesafe-sdk==0.7.0",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
otter = [
    "huggingface-hub==0.36.2",
    "numpy==2.5.2",
    "safetensors==0.8.0",
    "tokenizers==0.22.2",
    "transformers==4.56.2",
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.9.1%2Bcpu-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=3bf9b442a51a2948e41216a76d7ab00f0694cfcaaa51b6f9bcab57b7f89843e6 ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.9.1%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=7417d8c565f219d3455654cb431c6d892a3eb40246055e14d645422de13b9ea1 ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.9.1%2Bcpu-cp312-cp312-win_amd64.whl#sha256=a4e06b4f441675d26b462123c8a83e77c55f1ec8ebc081203be2db1ea8054add ; python_version == '3.12' and sys_platform == 'win32' and platform_machine == 'AMD64'",
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.9.1%2Bcpu-cp312-cp312-win_arm64.whl#sha256=1abe31f14b560c1f062699e966cb08ef5b67518a1cfac2d8547a3dbcd8387b06 ; python_version == '3.12' and sys_platform == 'win32' and platform_machine == 'ARM64'",
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.9.1%2Bcpu-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=3e532e553b37ee859205a9b2d1c7977fd6922f53bbb1b9bfdd5bdc00d1a60ed4 ; python_version == '3.13' and sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.9.1%2Bcpu-cp313-cp313-manylinux_2_28_x86_64.whl#sha256=39b3dff6d8fba240ae0d1bede4ca11c2531ae3b47329206512d99e17907ff74b ; python_version == '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.9.1%2Bcpu-cp313-cp313-win_amd64.whl#sha256=404a7ab2fffaf2ca069e662f331eb46313692b2f1630df2720094284f390ccef ; python_version == '3.13' and sys_platform == 'win32' and platform_machine == 'AMD64'",
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.9.1%2Bcpu-cp313-cp313-win_arm64.whl#sha256=161decbff26a33f13cb5ba6d2c8f458bbf56193bcc32ecc70be6dd4c7a3ee79d ; python_version == '3.13' and sys_platform == 'win32' and platform_machine == 'ARM64'",
]


[dependency-groups]
dev = [
    "build>=1,<2",
    "httpx2>=2,<3",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools]
py-modules = ["bootstrap", "model_specs", "hashing", "version"]

[tool.setuptools.packages.find]
where = ["."]
include = ["contracts*", "resolution*", "runtime*", "adapters*", "transport*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
